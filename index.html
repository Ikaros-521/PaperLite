<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperLite · 论文速写编辑器</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css"
      onerror="this.onerror=null;this.href='https://registry.npmmirror.com/codemirror/5.65.16/files/lib/codemirror.css'">
<link rel="stylesheet" href="vendor/katex/katex.min.css"
      onerror="this.onerror=null;this.href='https://registry.npmmirror.com/katex/0.16.11/files/dist/katex.min.css'">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="banner" style="display:none"></div>

<header id="topbar">
  <div class="brand">📄 PaperLite <span class="sub">论文速写 · LaTeX 实时预览</span></div>

  <div class="tb-group">
    <div class="dropdown">
      <button id="tplDropdown" class="btn">模板 ▾</button>
      <div id="tplMenu" class="menu">
        <button data-tpl="demo">📄 中文示例论文（推荐）</button>
        <button data-tpl="flow">🔀 TikZ 流程图速查</button>
        <button data-tpl="blank">✒️ 空白论文</button>
      </div>
    </div>
    <button id="btnOpen" class="btn" title="打开 .tex 文件">📂 打开</button>
    <button id="btnTex" class="btn" title="下载 .tex（可导入 Overleaf / 本地 TeX 编译）">💾 下载 .tex</button>
    <button id="btnHtml" class="btn" title="导出独立 HTML">🌐 导出 HTML</button>
    <button id="btnPdf" class="btn primary" title="调起浏览器打印，选择『另存为 PDF』即得矢量 PDF">🖨 导出 PDF</button>
  </div>

  <div class="tb-group edit-tools">
    <button id="tSec" class="btn sm" title="插入 \section">H1</button>
    <button id="tSub" class="btn sm" title="插入 \subsection">H2</button>
    <span class="tsep"></span>
    <button id="tB" class="btn sm" title="加粗 Ctrl+B"><b>B</b></button>
    <button id="tI" class="btn sm" title="斜体 Ctrl+I"><i>I</i></button>
    <button id="tU" class="btn sm" title="下划线"><u>U</u></button>
    <button id="tTt" class="btn sm" title="等宽">T</button>
    <span class="tsep"></span>
    <button id="tMath" class="btn sm" title="行内公式">$x$</button>
    <button id="tEq" class="btn sm" title="行间公式环境">∑</button>
    <span class="tsep"></span>
    <button id="tList" class="btn sm" title="无序列表">•≡</button>
    <button id="tEnum" class="btn sm" title="有序列表">1≡</button>
    <button id="tTable" class="btn sm" title="三线表">▦</button>
    <button id="tImg" class="btn sm" title="插入本地图片（转 base64 内嵌）">🖼</button>
    <button id="tFlow" class="btn sm accent" title="插入 TikZ 流程图">🔀 流程图</button>
    <button id="tMermaid" class="btn sm" title="插入 Mermaid 图">🏝</button>
    <span class="tsep"></span>
    <button id="tBib" class="btn sm" title="插入引用">[引]</button>
    <button id="tFn" class="btn sm" title="脚注">†</button>
  </div>

  <div class="tb-right">
    <div class="view-switch">
      <button data-view="edit" class="btn sm" title="仅编辑">✎</button>
      <button data-view="split" class="btn sm" title="分屏">▤▤</button>
      <button data-view="preview" class="btn sm" title="仅预览">👁</button>
    </div>
  </div>
</header>

<main id="layout" data-mode="split" style="--split:52%">
  <section id="editorPane">
    <div id="editorHost"></div>
    <input type="file" id="fileInput" accept=".tex,.txt,.latex,image/*" hidden>
  </section>
  <div id="divider" title="拖动调整分栏"></div>
  <section id="previewPane">
    <div id="previewBar">
      <span class="pb-title">预览</span>
      <label class="pb-toggle" title="编辑器与预览同步滚动"><input type="checkbox" id="btnSync" checked> 同步滚动</label>
      <span class="pb-spacer"></span>
      <button id="btnRender" class="btn sm" title="立即重渲染 (Ctrl+Enter)">⟳ 渲染</button>
      <button id="btnPanel" class="btn sm" title="图样式编辑面板">🎨 图样式</button>
      <span class="pb-zoom">
        <button id="zoomOut" class="btn sm">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" class="btn sm">＋</button>
      </span>
    </div>
    <div id="previewScroll">
      <div id="preview"><div id="paper" class="paper"></div></div>
    </div>
    <aside id="stylePanel" class="open"></aside>
  </section>
</main>

<footer id="statusbar">
  <span id="stWords"></span>
  <span class="sep">·</span>
  <span id="stRender"></span>
  <span class="sep">·</span>
  <span id="stWarn" class="st-warn">✓ 无警告</span>
  <span class="grow"></span>
  <span id="stSaved"></span>
  <span class="hint">Ctrl+S 保存 · Ctrl+Enter 重渲染 · 改图样式请点预览中的图形</span>
</footer>

<!-- 模块（顺序定义全局 PaperLite.*） -->
<script src="js/samples.js"></script>
<script src="js/tikz.js"></script>
<script src="js/latex.js"></script>
<script src="js/stylepanel.js"></script>
<script src="js/exporter.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>

<!-- 依赖加载（本地优先，CDN 兜底），完成后启动 -->
<script>
(function () {
  var R = 'https://registry.npmmirror.com';
  var chain = [
    ['vendor/codemirror/codemirror.min.js', R + '/codemirror/5.65.16/files/lib/codemirror.js'],
    ['vendor/codemirror/mode/stex/stex.min.js', R + '/codemirror/5.65.16/files/mode/stex/stex.js'],
    ['vendor/codemirror/addon/edit/closebrackets.min.js', R + '/codemirror/5.65.16/files/addon/edit/closebrackets.js'],
    ['vendor/codemirror/addon/edit/matchbrackets.min.js', R + '/codemirror/5.65.16/files/addon/edit/matchbrackets.js'],
    ['vendor/codemirror/addon/selection/active-line.min.js', R + '/codemirror/5.65.16/files/addon/selection/active-line.js'],
    ['vendor/katex/katex.min.js', R + '/katex/0.16.11/files/dist/katex.min.js']
  ];
  function tryOne(urls, cb) {
    if (!urls.length) return cb(false);
    var s = document.createElement('script');
    s.src = urls[0];
    s.onload = function () { cb(true); };
    s.onerror = function () { s.remove(); tryOne(urls.slice(1), cb); };
    document.head.appendChild(s);
  }
  (function run(i) {
    if (i >= chain.length) { window.PaperLite && PaperLite.app && PaperLite.app.start(); return; }
    tryOne(chain[i], function () { run(i + 1); });
  })(0);
})();
</script>
</body>
</html>
